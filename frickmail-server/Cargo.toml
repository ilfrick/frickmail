[workspace]
members = [
    "crates/frickmail-server",
    "crates/fm-core",
    "crates/fm-db",
    "crates/fm-http",
    "crates/fm-imap",
    "crates/fm-mime",
    "crates/fm-oidc",
    "crates/fm-plugin-compat",
    "crates/fm-session",
    "crates/fm-smtp",
    "crates/fm-user",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Frickmail contributors"]
repository = "https://github.com/ilfrick/frickmail"

[workspace.dependencies]
ammonia = "4.1"
anyhow = "1.0"
argon2 = { version = "0.5", features = ["std"] }
async-imap = { version = "0.11", default-features = false, features = ["runtime-tokio"] }
async-trait = "0.1"
axum = { version = "0.8", features = ["macros"] }
base64 = "0.22"
chacha20poly1305 = "0.10"
config = { version = "0.15", default-features = false, features = ["toml"] }
data-encoding = "2"
deadpool-redis = "0.18"
hmac = "0.12"
http = "1"
imap-proto = "0.16"
futures = "0.3"
lettre = { version = "0.11", default-features = false, features = ["builder", "hostname", "pool", "smtp-transport", "tokio1-rustls-tls"] }
mail-builder = "0.4"
mail-parser = "0.10"
openidconnect = "4"
p256 = { version = "0.13", features = ["ecdsa", "pem", "pkcs8"] }
qrcode = "0.14"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rand_core = { version = "0.6", features = ["getrandom"] }
rustls-pki-types = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"
sha1 = "0.10"
sha2 = "0.10"
sqlx = { version = "0.8", default-features = false, features = ["any", "chrono", "json", "macros", "mysql", "postgres", "runtime-tokio-rustls", "sqlite", "uuid"] }
thiserror = "2"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "time"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["logging", "ring", "tls12"] }
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.6", features = ["compression-gzip", "cors", "fs", "trace"] }
tower-sessions = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"
webpki-roots = "1"
