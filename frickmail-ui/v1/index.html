<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Frickmail</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main id="app" aria-live="polite"><p>Loading Frickmail…</p></main>
<noscript><p>Frickmail needs JavaScript enabled.</p></noscript>
<script type="module">
import { ApiClient } from './js/api.js';
import { renderLogin } from './js/login.js';
import { loadMailbox, renderMailbox } from './js/mailbox.js';

const api = new ApiClient('');
const root = document.getElementById('app');

async function showMailbox() {
	try {
		const data = await loadMailbox(api, 'INBOX', { limit: 25 });
		root.innerHTML = '<h1 data-fm="title">Inbox</h1>' + renderMailbox(data);
	} catch (error) {
		root.innerHTML = '<p>Cannot load the mailbox.</p>';
	}
}

try {
	const session = await api.bootstrap();
	if (session && session.authenticated) {
		await showMailbox();
	} else {
		renderLogin(root, api, showMailbox);
	}
} catch (error) {
	root.innerHTML = '<p>Cannot reach the Frickmail server.</p>';
}
</script>
</body>
</html>
