		+ '<span data-fm="nav-brand"><span data-fm="brand-mark">F</span>Frickmail</span>'
		+ '<button type="button" data-fm="nav-inbox"' + current('inbox') + '>Inbox</button>'
		+ '<button type="button" data-fm="nav-unified"' + current('unified') + '>Unified</button>'
		+ '<button type="button" data-fm="nav-search"' + current('search') + '>Search</button>'

		+ '<button type="button" data-fm="nav-contacts"' + current('contacts') + '>Contacts</button>'

		+ '<button type="button" data-fm="nav-logout">Sign out</button>'

	const contactsButton = root.querySelector('[data-fm="nav-contacts"]');
	const identitiesButton = root.querySelector('[data-fm="nav-identities"]');
	const calendarButton = root.querySelector('[data-fm="nav-calendar"]');
	const settingsButton = root.querySelector('[data-fm="nav-settings"]');
	const composeButton = root.querySelector('[data-fm="nav-compose"]');
	const logoutButton = root.querySelector('[data-fm="nav-logout"]');

		inboxButton.addEventListener('click', () => showMailbox('INBOX'));

	if (accountsButton) {
		accountsButton.addEventListener('click', () => showAccounts());
	}
	if (tasksButton) {
		tasksButton.addEventListener('click', () => showTasks('all'));
	}
	if (searchButton) {
		searchButton.addEventListener('click', () => showSearch(''));
	}
	if (unifiedButton) {
		unifiedButton.addEventListener('click', showUnifiedInbox);
	}
	if (smimeButton) {
		smimeButton.addEventListener('click', showSmime);
	}
	if (rulesButton) {
		rulesButton.addEventListener('click', () => showRules());
	}
	if (contactsButton) {
		contactsButton.addEventListener('click', () => showContacts());
	}
	if (identitiesButton) {
		identitiesButton.addEventListener('click', () => showIdentities());
	}
	if (calendarButton) {
		calendarButton.addEventListener('click', () => showCalendar());
	}
	if (settingsButton) {
		settingsButton.addEventListener('click', () => showSettings('general'));
	}
	if (composeButton) {
		composeButton.addEventListener('click', () => showCompose());
	}
	if (logoutButton) {
		logoutButton.addEventListener('click', signOut);
	}
	syncStickyOffset();
}

/// Publishes the measured height of the top navigation as
/// `--fm-sticky-top`, so the action toolbars below it stick *under* the nav
/// instead of sliding underneath it. The nav wraps to a second row on narrow
/// windows, so the offset is re-measured on every render and on resize rather
/// than hard-coded in CSS.
function syncStickyOffset() {
	const nav = root.querySelector('[data-fm="nav"]');
	if (!nav) {
		root.style.setProperty('--fm-sticky-top', '0px');
		return;
	}
	root.style.setProperty('--fm-sticky-top', nav.offsetHeight + 'px');
}

window.addEventListener('resize', syncStickyOffset);

async function signOut() {
	document.body.classList.remove('fm-app');
	try {
		await api.logout();
	} catch (error) {
		void error;
	}
	// Refresh the CSRF token: logout cleared it and the next sign-in needs
	// a bootstrapped one. Failure still lands on the login form, whose first
	// submit will surface the token error honestly.
	try {
		await api.bootstrap();
	} catch (error) {
		void error;
	}
	renderLogin(root, api, enterApp);
}

async function showTasks(filter) {
	try {
		const data = await loadTasks(api, filter);
		root.innerHTML = nav('tasks')
			+ '<h1 data-fm="title">Tasks</h1>'
			+ renderTasksFilter(filter)
			+ renderTaskForm()
			+ '<div data-fm="tasks-wrap">' + renderTasks(data) + '</div>'
			+ '<p data-fm="status"></p>';
		wireNav();
		const select = root.querySelector('[data-fm="filter"]');
		if (select) {
			select.addEventListener('change', () => showTasks(select.value));
		}
		const form = root.querySelector('[data-fm="add"]');
		if (form) {
			form.addEventListener('submit', onTaskAdd);
		}
		for (const button of root.querySelectorAll('[data-fm="toggle"]')) {
			button.addEventListener('click', () => onTaskToggle(button.getAttribute('data-id')));
		}
		for (const button of root.querySelectorAll('[data-fm="delete"]')) {
			button.addEventListener('click', () => onTaskDelete(button.getAttribute('data-id')));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load tasks.</p>';
	}
}

function tasksStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

async function onTaskAdd(event) {
	event.preventDefault();
	try {
		const payload = collectTaskPayload(root);
		if (!payload.title.trim()) {
			tasksStatus('A task title is required.');
			return;
		}
		await addTask(api, payload);
		const select = root.querySelector('[data-fm="filter"]');
		await showTasks(select ? select.value : 'all');
	} catch (error) {
		tasksStatus(error && error.message ? error.message : 'Add failed.');
	}
}

async function onTaskToggle(id) {
	const numeric = Number(id) || 0;
	const row = root.querySelector('[data-fm="task"][data-id="' + numeric + '"]');
	const done = !!(row && row.getAttribute('data-done'));
	try {
		await setTaskCompleted(api, numeric, !done);
		const select = root.querySelector('[data-fm="filter"]');
		await showTasks(select ? select.value : 'all');
	} catch (error) {
		tasksStatus(error && error.message ? error.message : 'Update failed.');
	}
}

async function onTaskDelete(id) {

}

async function showSearch(query) {
	const current = typeof query === 'string' ? query : '';
	try {
		const data = current.trim().length >= 2 ? await runSearch(api, { q: current }) : null;
		root.innerHTML = nav('search')
			+ '<h1 data-fm="title">Search</h1>'
			+ renderSearchForm(current)
			+ '<div data-fm="results-wrap">' + renderSearchResults(data) + '</div>';
		wireNav();
		const form = root.querySelector('[data-fm="search-form"]');
		if (form) {
			form.addEventListener('submit', (event) => {
				event.preventDefault();
				const field = root.querySelector('[data-fm="q"]');
				showSearch(field ? field.value : '');
			});
		}
		for (const row of root.querySelectorAll('[data-fm="result"]')) {
			row.addEventListener('click', () => showMessage(
				row.getAttribute('data-folder') || 'INBOX',
				row.getAttribute('data-uid'),
				{
					accountId: row.getAttribute('data-account'),
					back: () => showSearch(current)
				}
			));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot search right now.</p>';
	}
}

/// Fills the export form from a key row, so a user can export straight from
/// the list. Ticks the private-key box when the secret half is held.
function onPgpExportPick(button) {
	const form = root.querySelector('[data-fm="pgp-export-form"]');
	if (!form) {
		return;
	}
	const keyId = form.querySelector('[data-fm="export-key-id"]');
	const secret = form.querySelector('[data-fm="export-secret"]');
	if (keyId) {
		keyId.value = button.getAttribute('data-fingerprint') || '';
	}
	if (secret) {
		secret.checked = button.getAttribute('data-secret') === '1';
	}
	const passphrase = form.querySelector('[data-fm="export-passphrase"]');
	if (passphrase) {
		passphrase.focus();
	}
}

async function onPgpDelete(button) {
	const keyId = button.getAttribute('data-fingerprint') || '';
	const row = button.closest ? button.closest('[data-fm="pgp-key"]') : null;
	const secret = !!(row && row.getAttribute('data-secret') === '1');
	// Removal is irreversible and takes out the secret half as well, so ask
	// before touching the keyring.
	const question = secret
		? 'Delete this key and its private half? This cannot be undone.'
		: 'Delete this public key? This cannot be undone.';
	if (typeof window !== 'undefined' && typeof window.confirm === 'function'
		&& !window.confirm(question)) {
		return;
	}
	try {
		// A secret key keeps its public half in the keyring, so both halves have
		// to go for the key to disappear from the list.
		await removePgpKey(api, { fingerprint: keyId, secret });
		await showPgp();
	} catch (error) {
		pgpStatus(error && error.message ? error.message : 'Delete failed.');
	}
}

/// Visible calendar state across re-renders: month view, checked calendars,
/// and the last loaded payloads (events feed the editor without refetch).
const calendarView = {
	view: null,
	selectedIds: null,
	calendars: [],
	events: []
};

function currentMonthView() {
	const now = new Date();
	return { year: now.getFullYear(), month: now.getMonth() + 1 };
}

function monthRangeIso(view) {
	const pad = (value) => String(value).padStart(2, '0');
	const last = new Date(Date.UTC(view.year, view.month, 0)).getUTCDate();
	return {
		start: view.year + '-' + pad(view.month) + '-01T00:00:00Z',
		end: view.year + '-' + pad(view.month) + '-' + last + 'T23:59:59Z'
	};
}

async function showCalendar(view, selectedIds) {
	calendarView.view = view || calendarView.view || currentMonthView();
	try {
		const session = await api.bootstrap();
		const accountId = session && session.selected_account_id
			? session.selected_account_id
			: undefined;
		const calendars = await loadCalendars(api, accountId);
		calendarView.calendars = calendars && Array.isArray(calendars.calendars)
			? calendars.calendars
			: [];
		const allIds = calendarView.calendars.map((entry) => entry.id).filter((id) => id);
		calendarView.selectedIds = selectedIds || calendarView.selectedIds || allIds;
		const range = monthRangeIso(calendarView.view);
		const data = await loadEvents(api, {
			accountId,
			calendarIds: calendarView.selectedIds,
			start: range.start,
			end: range.end
		});
		calendarView.events = data && Array.isArray(data.events) ? data.events : [];
		root.innerHTML = nav('calendar')
			+ '<h1 data-fm="title">Calendar</h1>'
			+ '<div data-fm="pager">'
			+ '<button type="button" data-fm="prev">‹</button>'
			+ '<span data-fm="month">' + formatMonthTitle(calendarView.view) + '</span>'
			+ '<button type="button" data-fm="today">Today</button>'
			+ '<button type="button" data-fm="next">›</button>'
			+ ' <button type="button" data-fm="new">New event</button>'
			+ '</div>'
			+ renderCalendarList({ calendars: calendarView.calendars }, calendarView.selectedIds)
			+ renderMonthGrid(calendarView.view, groupEventsByDate(calendarView.events))
			+ '<div data-fm="editor-wrap"></div>'
			+ '<p data-fm="status"></p>';
		wireNav();
		wireCalendar();
	} catch (error) {
		root.innerHTML = '<p>Cannot load the calendar.</p>';
	}
}

function wireCalendar() {
	const prev = root.querySelector('[data-fm="prev"]');
	const next = root.querySelector('[data-fm="next"]');
	const today = root.querySelector('[data-fm="today"]');
	const create = root.querySelector('[data-fm="new"]');
	if (prev) {
		prev.addEventListener('click', () => showCalendar(addMonths(calendarView.view, -1)));
	}
	if (next) {
		next.addEventListener('click', () => showCalendar(addMonths(calendarView.view, 1)));
	}
	if (today) {
		today.addEventListener('click', () => showCalendar(currentMonthView()));
	}
	if (create) {
		create.addEventListener('click', () => openEventEditor(null));
	}
	for (const box of root.querySelectorAll('[data-fm="calendar"]')) {
		box.addEventListener('change', () => {
			const checked = [];
			for (const item of root.querySelectorAll('[data-fm="calendar"]:checked')) {
				checked.push(item.value);
			}
			showCalendar(calendarView.view, checked);
		});
	}
	for (const chip of root.querySelectorAll('[data-fm="event"]')) {
		chip.addEventListener('click', () => {
			const found = calendarView.events.find((event) => String(event.id) === chip.getAttribute('data-id'));
			openEventEditor(found || null);
		});
	}
}

function openEventEditor(event) {
	const wrap = root.querySelector('[data-fm="editor-wrap"]');
	if (!wrap) {
		return;
	}
	wrap.innerHTML = renderEventEditor(event, calendarView.calendars);
	const form = wrap.querySelector('[data-fm="editor"]');
	if (form) {
		form.addEventListener('submit', onEventSubmit);
	}
	const remove = wrap.querySelector('[data-fm="delete"]');
	if (remove) {
		remove.addEventListener('click', onEventDelete);
	}
}

/// The Settings hub: a left menu of sections and a panel on the right, so
/// S/MIME, OpenPGP, identities, accounts and filter rules live where users
/// expect them instead of as separate top-level buttons.
const SETTINGS_SECTIONS = [
	['general', 'General'],
	['appearance', 'Appearance'],
	['accounts', 'Accounts'],
	['identities', 'Identities'],
	['smime', 'S/MIME'],
	['pgp', 'OpenPGP'],
	['security', 'Security'],
	['rules', 'Rules']
];

/// Which account an account-editor panel is editing, if any. Reset by the hub
/// after use so re-opening Accounts shows the add form.
let settingsEditAccountId = null;

function isSettingsSection(value) {
	return SETTINGS_SECTIONS.some((entry) => entry[0] === value);
}

async function showSettings(section) {
	const current = isSettingsSection(section) ? section : 'general';
	const menu = SETTINGS_SECTIONS.map(
		([id, label]) =>
			'<button type="button" data-fm="settings-tab" data-section="' + id + '"'
			+ (id === current ? ' aria-current="page"' : '')
			+ '>'
			+ label
			+ '</button>'
	).join('');
	let panel;
	try {
		panel = await renderSettingsPanel(current);
	} catch (error) {
		panel = '<p>Cannot load this settings section.</p>';
	}
	root.innerHTML = nav('settings')
		+ '<div data-fm="settings-layout">'
		+ '<nav data-fm="settings-menu">' + menu + '</nav>'
		+ '<div data-fm="settings-panel">' + panel + '</div>'
		+ '</div>';
	wireNav();
	for (const button of root.querySelectorAll('[data-fm="settings-tab"]')) {
		button.addEventListener('click', () => showSettings(button.getAttribute('data-section')));
	}
	await wireSettingsPanel(current);
}

/// Builds one settings panel. Kept as a table of small builders so adding a
/// section is one entry in `SETTINGS_SECTIONS` plus one branch here.
async function renderSettingsPanel(section) {
	if (section === 'appearance') {
		return '<h2 data-fm="subtitle">Appearance</h2>'
			+ '<p>Choose the interface theme.</p>'
			+ '<div data-fm="theme-choices">'
			+ '<button type="button" data-theme="dark"'
			+ (currentTheme() === 'dark' ? ' aria-pressed="true"' : '')
			+ '>Dark</button>'
			+ '<button type="button" data-theme="light"'
			+ (currentTheme() === 'light' ? ' aria-pressed="true"' : '')
			+ '>Light</button>'
			+ '</div>';
	}
	if (section === 'general') {
		const data = await loadPreferences(api);
		return '<h2 data-fm="subtitle">Preferences</h2>'
			+ renderPreferencesForm(data.preferences)
			+ '<p data-fm="status"></p>';
	}
	if (section === 'accounts') {
		const data = await loadAccounts(api);
		const accounts = data && Array.isArray(data.accounts) ? data.accounts : [];
		const editing = settingsEditAccountId
			? accounts.find((account) => String(account.id) === String(settingsEditAccountId)) || null
			: null;
		return '<h2 data-fm="subtitle">Mail accounts</h2>'
			+ renderAccounts(data)
			+ '<h2 data-fm="subtitle">' + (editing ? 'Edit account' : 'Add account') + '</h2>'
			+ renderAccountEditor(editing)
			+ '<p data-fm="status"></p>';
	}
	if (section === 'identities') {
		const session = await api.bootstrap();
		identitiesAccountId = session && session.selected_account_id
			? session.selected_account_id
			: 0;
		const data = await loadIdentities(api, identitiesAccountId);
		return '<h2 data-fm="subtitle">Sender identities</h2>'
			+ renderIdentityForm()
			+ renderIdentities(data)
			+ '<p data-fm="status"></p>';
	}
	if (section === 'smime') {
		const data = await loadSmimeCerts(api);
		return '<h2 data-fm="subtitle">S/MIME certificates</h2>'
			+ renderSmimeCerts(data)
			+ renderSmimeImportForms()
			+ '<p data-fm="status"></p>';
	}
	if (section === 'pgp') {
		const data = await loadPgpKeys(api);
		return '<h2 data-fm="subtitle">OpenPGP keys</h2>'
			+ renderPgpKeys(data)
			+ renderPgpForms()
			+ '<p data-fm="status"></p>';
	}
	if (section === 'security') {
		let totp = '<p data-fm="empty">Two-factor status unavailable.</p>';
		try {
			const status = await loadTotpStatus(api);
			totp = renderTotpStatus(status && status.enabled);
		} catch (error) {
			void error;
		}
		return '<h2 data-fm="subtitle">Two-factor authentication</h2>'
			+ '<div data-fm="totp-wrap">' + totp + '</div>'
			+ '<h2 data-fm="subtitle">Password</h2>'
			+ renderPasswordForm()
			+ '<p data-fm="status"></p>';
	}
	if (section === 'rules') {
		const session = await api.bootstrap();
		rulesAccountId = session && session.selected_account_id
			? session.selected_account_id
			: 0;
		const data = await loadRules(
			api,
			rulesAccountId ? { accountId: rulesAccountId } : undefined
		);
		return '<h2 data-fm="subtitle">Filter rules</h2>'
			+ renderRuleForm()
			+ renderRules(data)
			+ '<p data-fm="status"></p>';
	}
	return '';
}

/// Wires the interactive parts of the currently shown panel.
async function wireSettingsPanel(section) {
	if (section === 'appearance') {
		for (const button of root.querySelectorAll('[data-fm="theme-choices"] button')) {
			button.addEventListener('click', () => {
				applyTheme(button.getAttribute('data-theme'));
				for (const other of root.querySelectorAll('[data-fm="theme-choices"] button')) {
					other.setAttribute(
						'aria-pressed',
						other.getAttribute('data-theme') === currentTheme() ? 'true' : 'false'
					);
				}
			});
		}
		return;
	}
	if (section === 'general') {
		wireSettingsForm();
		return;
	}
	if (section === 'accounts') {
		wireAccounts();
		return;
	}
	if (section === 'identities') {
		const form = root.querySelector('[data-fm="add"]');
		if (form) {
			form.addEventListener('submit', onIdentityAdd);
		}
		for (const button of root.querySelectorAll('[data-fm="default"]')) {
			button.addEventListener('click', () => onIdentityDefault(button.getAttribute('data-id')));
		}
		for (const button of root.querySelectorAll('[data-fm="delete"]')) {
			button.addEventListener('click', () => onIdentityDelete(button.getAttribute('data-id')));
		}
		return;
	}
	if (section === 'smime') {
		const certForm = root.querySelector('[data-fm="import-cert"]');
		if (certForm) {
			certForm.addEventListener('submit', onSmimeCertSubmit);
		}
		const p12Form = root.querySelector('[data-fm="import-p12"]');
		if (p12Form) {
			p12Form.addEventListener('submit', onSmimeP12Submit);
		}
		for (const button of root.querySelectorAll('[data-fm="delete"]')) {
			button.addEventListener('click', () => onSmimeDelete(button.getAttribute('data-id')));
		}
		return;
	}
	if (section === 'pgp') {
		const generateForm = root.querySelector('[data-fm="pgp-generate"]');
		if (generateForm) {
			generateForm.addEventListener('submit', onPgpGenerateSubmit);
		}
		const importForm = root.querySelector('[data-fm="pgp-import"]');
		if (importForm) {
			importForm.addEventListener('submit', onPgpImportSubmit);
		}
		const exportForm = root.querySelector('[data-fm="pgp-export-form"]');
		if (exportForm) {
			exportForm.addEventListener('submit', onPgpExportSubmit);
		}
		for (const button of root.querySelectorAll('[data-fm="pgp-export"]')) {
			button.addEventListener('click', () => onPgpExportPick(button));
		}
		for (const button of root.querySelectorAll('[data-fm="pgp-delete"]')) {
			button.addEventListener('click', () => onPgpDelete(button));
		}
		return;
	}
	if (section === 'security') {
		wireTotp();
		wirePasswordForm();
		return;
	}
	if (section === 'rules') {
		const form = root.querySelector('[data-fm="add"]');
		if (form) {
			form.addEventListener('submit', onRuleAdd);
		}
		for (const button of root.querySelectorAll('[data-fm="toggle"]')) {
			button.addEventListener('click', () => onRuleToggle(button.getAttribute('data-id')));
		}
		for (const button of root.querySelectorAll('[data-fm="delete"]')) {
			button.addEventListener('click', () => onRuleDelete(button.getAttribute('data-id')));
		}
	}
}

/// Current theme: the `data-fm-theme` attribute on `<html>`, defaulting to
/// dark. Pure read.
function currentTheme() {
	return document.documentElement.getAttribute('data-fm-theme') === 'light' ? 'light' : 'dark';
}

/// Applies a theme by attribute and remembers it locally. The legacy theme
/// model stores this server-side; adopting that (and the Frickmail theme
/// switcher) is a follow-up, so this is deliberately a local preference.
function applyTheme(name) {
	const theme = name === 'light' ? 'light' : 'dark';
	document.documentElement.setAttribute('data-fm-theme', theme);
	try {
		window.localStorage.setItem('fm-theme', theme);
	} catch (error) {
		void error;
	}
}

/// Restores the remembered theme at boot. Called once from the shell.
function restoreTheme() {
	try {
		const stored = window.localStorage.getItem('fm-theme');
		if (stored === 'light' || stored === 'dark') {
			document.documentElement.setAttribute('data-fm-theme', stored);
		}
	} catch (error) {
		void error;
	}
}

	} catch (error) {

	}
	// The OpenPGP controls only appear when the keyring actually has something

/// Remembers, per message, whether the reader chose to load remote images, so
/// the toggle survives the re-render a flag change triggers.
const remoteImageChoice = new Map();

async function showMessage(folder, uid, options) {
	const settings = options || {};
	const back = typeof settings.back === 'function'
		? settings.back
		: () => showMailbox(folder);
	try {
		const message = await loadMessage(api, folder, uid, { accountId: settings.accountId });
		const selected = selectMessageBody(message);
		const messageKey = folder + ':' + uid;
		const allowRemote = remoteImageChoice.get(messageKey) === true;
		const context = { folder, uid: Number(uid), accountId: settings.accountId };

		let viewer = '';
		let imageBar = '';
		if (selected.kind === 'html') {
			// Rewrite inline (`cid:`) images to the attachment endpoint, then
			// decide whether remote images load now or wait for a click.
			const html = rewriteCidSources(selected.body, message.attachments, context);
			const prepared = readerDocument(html, { allowRemote });
			if (prepared.blocked > 0) {
				imageBar = '<div data-fm="image-bar">'
					+ '<span>Remote images are blocked to protect your privacy.</span>'
					+ '<button type="button" data-fm="show-images">Show images</button>'
					+ '</div>';
			}
			const frame = document.createElement('iframe');
			frame.setAttribute('data-fm', 'body');
			frame.setAttribute('sandbox', '');
			frame.setAttribute('title', 'Message body');
			frame.srcdoc = prepared.document;
			viewer = frame.outerHTML;
		} else {
			const pre = document.createElement('pre');
			pre.setAttribute('data-fm', 'body-plain');
			pre.textContent = selected.body;
			viewer = pre.outerHTML;
		}

		let folders = { folders: [] };
		try {
			folders = await loadFolders(api);
		} catch (error) {
			// The reading pane still works without a destination picker; the
			// toolbar simply renders without Move/Copy/Archive/Spam.
			void error;
		}
		root.innerHTML = nav('')
			+ '<div data-fm="message-bar"><button type="button" data-fm="back">Back</button>'
			+ escapeHtml(folder)
			+ '</div>'
			+ renderMessageToolbar({ folder, folders, message })
			+ renderMessageHeader(message)
			+ imageBar
			+ viewer
			+ renderAttachments(message, context);
		wireNav();
		root.querySelector('[data-fm="back"]').addEventListener('click', () => back());
		const showImages = root.querySelector('[data-fm="show-images"]');
		if (showImages) {
			showImages.addEventListener('click', () => {
				remoteImageChoice.set(messageKey, true);
				showMessage(folder, uid, { back, accountId: settings.accountId });
			});
		}
		wireMessageActions(folder, uid, message, folders, back, settings.accountId);
	} catch (error) {
		root.innerHTML = '<p>Cannot load the message.</p>';
	}
}

/// Wires the reading-pane toolbar. `reload` re-opens the same message after
/// an in-place flag change; `back` returns to the list after the message
/// leaves the current folder.
function wireMessageActions(folder, uid, message, folders, back, accountId) {
	const uids = [Number(uid)];
	const target = () => {
		const select = root.querySelector('[data-fm="target"]');
		return select ? select.value : '';
	};
	for (const button of root.querySelectorAll('[data-fm="toolbar"] [data-fm="action"]')) {
		button.addEventListener('click', async () => {
			const action = button.getAttribute('data-action');
			try {
				if (action === 'reply' || action === 'reply-all' || action === 'forward') {
					await showCompose(buildActionSeed(message, action));
					return;
				}
				if (action === 'flag') {
					const starred = (message.flags || []).indexOf('\\flagged') !== -1;
					await setMessageFlag(api, {
						folder,
						uids,
						flag: 'flagged',
						set: !starred
					});
					await showMessage(folder, uid, { back, accountId });
					return;
				}
				if (action === 'unread') {
					await setMessageFlag(api, { folder, uids, flag: 'seen', set: false });
					await back();
					return;
				}
				if (action === 'move' || action === 'copy') {
					const toFolder = target();
					if (!toFolder) {
						actionStatus('Pick a destination folder first.');
						return;
					}
					const payload = { folder, uids, to_folder: toFolder };
					if (action === 'move') {
						await moveMessages(api, payload);
					} else {
						await copyMessages(api, payload);
					}
					if (action === 'move') {
						await back();
					} else {
						await showMessage(folder, uid, { back, accountId });
					}
					return;
				}
				if (action === 'archive' || action === 'spam') {
					const wanted = action === 'archive' ? ['archive', 'archives'] : ['junk', 'spam'];
					const destination = findSpecialFolder(folders, wanted);
					if (!destination) {
						actionStatus('No matching folder on this account.');
						return;
					}
					await moveMessages(api, { folder, uids, to_folder: destination });
					await back();
					return;
				}
				if (action === 'delete') {
					if (!window.confirm('Delete this message?')) {
						return;
					}
					await deleteMessages(api, { folder, uids });
					await back();
				}
			} catch (error) {
				actionStatus(actionErrorMessage(error, 'Action failed.'));
			}
		});
	}
}

/// Enters the authenticated app: ensures an account is selected (first
/// primary, else oldest — mirroring legacy login selection) so
/// account-dependent views work, then opens the inbox.
async function enterApp() {
	document.body.classList.add('fm-app');
	try {
		const session = await api.bootstrap();
		if (!session.selected_account_id) {
			const listing = await api.request('GET', '/accounts');
			const accounts = listing && Array.isArray(listing.accounts) ? listing.accounts : [];
			const primary = accounts.find((account) => account && account.is_primary)
				|| accounts.find((account) => account && account.id);
			if (primary) {
				await api.request('POST', '/switch-account', {
					body: { account_id: primary.id }
				});
			}
		}
	} catch (error) {
		void error;
	}
	await showMailbox('INBOX');
}

	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

async function onAccountSubmit(event) {
	event.preventDefault();
	try {
		const payload = collectAccountPayload(root);
		if (payload.id) {
			const id = payload.id;
			delete payload.id;
			await updateAccount(api, id, payload);
		} else {
			await addAccount(api, payload);
		}
		await showAccounts();
	} catch (error) {
		accountsStatus(error && error.message ? error.message : 'Save failed.');
	}
}

async function showMailbox(folder) {
	const current = typeof folder === 'string' && folder ? folder : 'INBOX';
	try {
		const folders = await loadFolders(api);
		const data = await loadMailbox(api, current, { limit: 25 });
		const folderData = (folders.folders || []).find(
			(item) => item && item.full_name === current
		) || {};
		root.innerHTML = nav('inbox')
			+ renderFolderToolbar({ folder: current, folders, folderData })
			+ renderFolderList(folders, current)
			+ renderMailbox(data);
		wireNav();
		for (const item of root.querySelectorAll('[data-fm="folder"]')) {
			item.addEventListener('click', () => {
				showMailbox(item.getAttribute('data-name') || 'INBOX');
			});
		}
		for (const item of root.querySelectorAll('[data-fm="message"]')) {
			item.addEventListener('click', () => {
				showMessage(current, item.getAttribute('data-uid'));
			});
		}
		wireFolderActions(current);
	} catch (error) {
		root.innerHTML = '<p>Cannot load the mailbox.</p>';
	}
}

/// Reports the outcome of a folder-level action in the toolbar, so a failed
/// mutation says why instead of silently reloading the list.
function actionStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

/// Wires the folder toolbar: mark-all-read, empty trash, refresh. Every
/// action reloads the folder on success so the counts and the list agree with
/// the server.
function wireFolderActions(folder) {
	for (const button of root.querySelectorAll('[data-fm="folder-toolbar"] [data-fm="action"]')) {
		button.addEventListener('click', async () => {
			const action = button.getAttribute('data-action');
			try {
				if (action === 'refresh') {
					await showMailbox(folder);
					return;
				}
				if (action === 'seen-all') {
					await markFolderRead(api, { folder });
					await showMailbox(folder);
					return;
				}
				if (action === 'empty') {
					if (!window.confirm('Permanently delete every message in ' + folder + '?')) {
						return;
					}
					await clearFolder(api, { folder });
					await showMailbox(folder);
				}
			} catch (error) {
				actionStatus(actionErrorMessage(error, 'Action failed.'));
			}
		});
	}
}

restoreTheme();

try {
	const session = await api.bootstrap();
	if (session && session.authenticated) {
		await enterApp();
	} else {
		document.body.classList.remove('fm-app');
		renderLogin(root, api, enterApp);
		await showOAuthProviders();
	}
} catch (error) {
	root.innerHTML = '<p>Cannot reach the Frickmail server.</p>';
}

/// Appends configured OAuth/SSO provider buttons under the login form.
/// Best-effort: password sign-in always works, providers only when the
/// server has them configured.
async function showOAuthProviders() {
	let data = null;
	try {
		data = await loadProviders(api);
	} catch (error) {
		void error;
		return;
	}
	const buttons = renderProviderButtons(data);
	if (!buttons) {
		return;
	}
	const form = root.querySelector('[data-fm="form"]');
	if (!form) {
		return;
	}
	const wrap = document.createElement('div');
	wrap.innerHTML = buttons;
	form.after(wrap);
	const entries = data && Array.isArray(data.providers) ? data.providers : [];
	for (const button of wrap.querySelectorAll('[data-fm="oauth"]')) {
		button.addEventListener('click', () => {
			const entry = entries.find((item) => item && item.id === button.getAttribute('data-id'))
				|| { url: button.getAttribute('data-url') };
			signInWithProvider(window, api, entry, enterApp, (text) => {
				const status = root.querySelector('[data-fm="status"]');
				if (status) {
					status.textContent = text;
				}
			});
		});
	}
}
