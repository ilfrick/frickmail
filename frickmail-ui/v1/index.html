<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Frickmail</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main id="app" aria-live="polite"><p>Loading Frickmail…</p></main>
<noscript><p>Frickmail needs JavaScript enabled.</p></noscript>
<script type="module">
import { ApiClient } from './js/api.js';
import { renderLogin } from './js/login.js';
import { loadMailbox, renderMailbox } from './js/mailbox.js';
import { loadFolders, renderFolderList } from './js/folders.js';
import { loadRules, renderRules } from './js/rules.js';
import { loadContacts, renderContacts } from './js/contacts.js';
import { collectComposePayload, renderComposeForm, sendMessage } from './js/compose.js';
import { loadMessage, renderAttachments, renderMessageHeader, selectMessageBody } from './js/message.js';
import { loadTasks, renderTasks, renderTasksFilter } from './js/tasks.js';
import { loadProviders, renderProviderButtons, signInWithProvider } from './js/oauth.js';
import {
	addAccount,
	collectAccountPayload,
	deleteAccount,
	loadAccounts,
	renderAccountEditor,
	renderAccounts,
	setPrimaryAccount,
	switchAccount,
	updateAccount
} from './js/accounts.js';
import {
	collectCertImport,
	collectP12Import,
	deleteSmimeCert,
	importSmimeCert,
	importSmimeP12,
	loadSmimeCerts,
	renderSmimeCerts,
	renderSmimeImportForms
} from './js/smime.js';
import {
	loadUnifiedInbox,
	renderSearchForm,
	renderSearchResults,
	renderUnifiedInbox,
	runSearch
} from './js/search.js';
import {
	addMonths,
	collectEventPayload,
	deleteEvent,
	formatMonthTitle,
	groupEventsByDate,
	loadCalendars,
	loadEvents,
	renderCalendarList,
	renderEventEditor,
	renderMonthGrid,
	saveEvent
} from './js/calendar.js';
import { collectPreferencesPatch, loadPreferences, renderPreferencesForm, savePreferences } from './js/settings.js';

const api = new ApiClient('');
const root = document.getElementById('app');

function nav(active) {
	const inbox = active === 'inbox' ? ' aria-current="page"' : '';
	const accounts = active === 'accounts' ? ' aria-current="page"' : '';
	const settings = active === 'settings' ? ' aria-current="page"' : '';
	const tasks = active === 'tasks' ? ' aria-current="page"' : '';
	const search = active === 'search' ? ' aria-current="page"' : '';
	const unified = active === 'unified' ? ' aria-current="page"' : '';
	const smime = active === 'smime' ? ' aria-current="page"' : '';
	const rules = active === 'rules' ? ' aria-current="page"' : '';
	const calendar = active === 'calendar' ? ' aria-current="page"' : '';
	const contacts = active === 'contacts' ? ' aria-current="page"' : '';
	const compose = active === 'compose' ? ' aria-current="page"' : '';
	return '<nav data-fm="nav">'
		+ '<button type="button" data-fm="nav-inbox"' + inbox + '>Inbox</button>'
		+ '<button type="button" data-fm="nav-accounts"' + accounts + '>Accounts</button>'
		+ '<button type="button" data-fm="nav-tasks"' + tasks + '>Tasks</button>'
		+ '<button type="button" data-fm="nav-search"' + search + '>Search</button>'
		+ '<button type="button" data-fm="nav-unified"' + unified + '>Unified</button>'
		+ '<button type="button" data-fm="nav-smime"' + smime + '>S/MIME</button>'
		+ '<button type="button" data-fm="nav-rules"' + rules + '>Rules</button>'
		+ '<button type="button" data-fm="nav-contacts"' + contacts + '>Contacts</button>'
		+ '<button type="button" data-fm="nav-calendar"' + calendar + '>Calendar</button>'
		+ '<button type="button" data-fm="nav-settings"' + settings + '>Settings</button>'
		+ '<button type="button" data-fm="nav-compose"' + compose + '>Compose</button>'
		+ '<button type="button" data-fm="nav-logout">Sign out</button>'
		+ '</nav>';
}

function wireNav() {
	const inboxButton = root.querySelector('[data-fm="nav-inbox"]');
	const accountsButton = root.querySelector('[data-fm="nav-accounts"]');
	const tasksButton = root.querySelector('[data-fm="nav-tasks"]');
	const searchButton = root.querySelector('[data-fm="nav-search"]');
	const unifiedButton = root.querySelector('[data-fm="nav-unified"]');
	const smimeButton = root.querySelector('[data-fm="nav-smime"]');
	const rulesButton = root.querySelector('[data-fm="nav-rules"]');
	const contactsButton = root.querySelector('[data-fm="nav-contacts"]');
	const calendarButton = root.querySelector('[data-fm="nav-calendar"]');
	const settingsButton = root.querySelector('[data-fm="nav-settings"]');
	const composeButton = root.querySelector('[data-fm="nav-compose"]');
	const logoutButton = root.querySelector('[data-fm="nav-logout"]');
	if (inboxButton) {
		inboxButton.addEventListener('click', () => showMailbox('INBOX'));
	}
	if (accountsButton) {
		accountsButton.addEventListener('click', () => showAccounts());
	}
	if (tasksButton) {
		tasksButton.addEventListener('click', () => showTasks('all'));
	}
	if (searchButton) {
		searchButton.addEventListener('click', () => showSearch(''));
	}
	if (unifiedButton) {
		unifiedButton.addEventListener('click', showUnifiedInbox);
	}
	if (smimeButton) {
		smimeButton.addEventListener('click', showSmime);
	}
	if (rulesButton) {
		rulesButton.addEventListener('click', () => showRules());
	}
	if (contactsButton) {
		contactsButton.addEventListener('click', () => showContacts());
	}
	if (calendarButton) {
		calendarButton.addEventListener('click', () => showCalendar());
	}
	if (settingsButton) {
		settingsButton.addEventListener('click', showSettings);
	}
	if (composeButton) {
		composeButton.addEventListener('click', () => showCompose());
	}
	if (logoutButton) {
		logoutButton.addEventListener('click', signOut);
	}
}

async function signOut() {
	try {
		await api.logout();
	} catch (error) {
		void error;
	}
	// Refresh the CSRF token: logout cleared it and the next sign-in needs
	// a bootstrapped one. Failure still lands on the login form, whose first
	// submit will surface the token error honestly.
	try {
		await api.bootstrap();
	} catch (error) {
		void error;
	}
	renderLogin(root, api, enterApp);
}

async function showTasks(filter) {
	try {
		const data = await loadTasks(api, filter);
		root.innerHTML = nav('tasks')
			+ '<h1 data-fm="title">Tasks</h1>'
			+ renderTasksFilter(filter)
			+ '<div data-fm="tasks-wrap">' + renderTasks(data) + '</div>';
		wireNav();
		const select = root.querySelector('[data-fm="filter"]');
		if (select) {
			select.addEventListener('change', () => showTasks(select.value));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load tasks.</p>';
	}
}

async function showSearch(query) {
	const current = typeof query === 'string' ? query : '';
	try {
		const data = current.trim().length >= 2 ? await runSearch(api, { q: current }) : null;
		root.innerHTML = nav('search')
			+ '<h1 data-fm="title">Search</h1>'
			+ renderSearchForm(current)
			+ '<div data-fm="results-wrap">' + renderSearchResults(data) + '</div>';
		wireNav();
		const form = root.querySelector('[data-fm="search-form"]');
		if (form) {
			form.addEventListener('submit', (event) => {
				event.preventDefault();
				const field = root.querySelector('[data-fm="q"]');
				showSearch(field ? field.value : '');
			});
		}
		for (const row of root.querySelectorAll('[data-fm="result"]')) {
			row.addEventListener('click', () => showMessage(
				row.getAttribute('data-folder') || 'INBOX',
				row.getAttribute('data-uid'),
				{
					accountId: row.getAttribute('data-account'),
					back: () => showSearch(current)
				}
			));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot search right now.</p>';
	}
}

async function showUnifiedInbox() {
	try {
		const data = await loadUnifiedInbox(api, { limit: 50 });
		root.innerHTML = nav('unified')
			+ '<h1 data-fm="title">Unified inbox</h1>'
			+ renderUnifiedInbox(data);
		wireNav();
		for (const row of root.querySelectorAll('[data-fm="unified"]')) {
			row.addEventListener('click', () => showMessage(
				'INBOX',
				row.getAttribute('data-uid'),
				{
					accountId: row.getAttribute('data-account'),
					back: showUnifiedInbox
				}
			));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load the unified inbox.</p>';
	}
}

async function showSmime() {
	try {
		const data = await loadSmimeCerts(api);
		root.innerHTML = nav('smime')
			+ '<h1 data-fm="title">S/MIME certificates</h1>'
			+ renderSmimeCerts(data)
			+ renderSmimeImportForms()
			+ '<p data-fm="status"></p>';
		wireNav();
		const certForm = root.querySelector('[data-fm="import-cert"]');
		if (certForm) {
			certForm.addEventListener('submit', onSmimeCertSubmit);
		}
		const p12Form = root.querySelector('[data-fm="import-p12"]');
		if (p12Form) {
			p12Form.addEventListener('submit', onSmimeP12Submit);
		}
		for (const button of root.querySelectorAll('[data-fm="delete"]')) {
			button.addEventListener('click', () => onSmimeDelete(button.getAttribute('data-id')));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load S/MIME certificates.</p>';
	}
}

function smimeStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

async function onSmimeCertSubmit(event) {
	event.preventDefault();
	try {
		await importSmimeCert(api, collectCertImport(root));
		await showSmime();
	} catch (error) {
		smimeStatus(error && error.message ? error.message : 'Import failed.');
	}
}

async function onSmimeP12Submit(event) {
	event.preventDefault();
	try {
		await importSmimeP12(api, collectP12Import(root));
		await showSmime();
	} catch (error) {
		smimeStatus(error && error.message ? error.message : 'Import failed.');
	}
}

async function onSmimeDelete(id) {
	try {
		await deleteSmimeCert(api, Number(id) || 0);
		await showSmime();
	} catch (error) {
		smimeStatus(error && error.message ? error.message : 'Delete failed.');
	}
}

async function showContacts() {
	try {
		const data = await loadContacts(api, { limit: 50 });
		root.innerHTML = nav('contacts')
			+ '<h1 data-fm="title">Contacts</h1>'
			+ renderContacts(data);
		wireNav();
	} catch (error) {
		root.innerHTML = '<p>Cannot load contacts.</p>';
	}
}

/// Visible calendar state across re-renders: month view, checked calendars,
/// and the last loaded payloads (events feed the editor without refetch).
const calendarView = {
	view: null,
	selectedIds: null,
	calendars: [],
	events: []
};

function currentMonthView() {
	const now = new Date();
	return { year: now.getFullYear(), month: now.getMonth() + 1 };
}

function monthRangeIso(view) {
	const pad = (value) => String(value).padStart(2, '0');
	const last = new Date(Date.UTC(view.year, view.month, 0)).getUTCDate();
	return {
		start: view.year + '-' + pad(view.month) + '-01T00:00:00Z',
		end: view.year + '-' + pad(view.month) + '-' + last + 'T23:59:59Z'
	};
}

async function showCalendar(view, selectedIds) {
	calendarView.view = view || calendarView.view || currentMonthView();
	try {
		const session = await api.bootstrap();
		const accountId = session && session.selected_account_id
			? session.selected_account_id
			: undefined;
		const calendars = await loadCalendars(api, accountId);
		calendarView.calendars = calendars && Array.isArray(calendars.calendars)
			? calendars.calendars
			: [];
		const allIds = calendarView.calendars.map((entry) => entry.id).filter((id) => id);
		calendarView.selectedIds = selectedIds || calendarView.selectedIds || allIds;
		const range = monthRangeIso(calendarView.view);
		const data = await loadEvents(api, {
			accountId,
			calendarIds: calendarView.selectedIds,
			start: range.start,
			end: range.end
		});
		calendarView.events = data && Array.isArray(data.events) ? data.events : [];
		root.innerHTML = nav('calendar')
			+ '<h1 data-fm="title">Calendar</h1>'
			+ '<div data-fm="pager">'
			+ '<button type="button" data-fm="prev">‹</button>'
			+ '<span data-fm="month">' + formatMonthTitle(calendarView.view) + '</span>'
			+ '<button type="button" data-fm="today">Today</button>'
			+ '<button type="button" data-fm="next">›</button>'
			+ ' <button type="button" data-fm="new">New event</button>'
			+ '</div>'
			+ renderCalendarList({ calendars: calendarView.calendars }, calendarView.selectedIds)
			+ renderMonthGrid(calendarView.view, groupEventsByDate(calendarView.events))
			+ '<div data-fm="editor-wrap"></div>'
			+ '<p data-fm="status"></p>';
		wireNav();
		wireCalendar();
	} catch (error) {
		root.innerHTML = '<p>Cannot load the calendar.</p>';
	}
}

function wireCalendar() {
	const prev = root.querySelector('[data-fm="prev"]');
	const next = root.querySelector('[data-fm="next"]');
	const today = root.querySelector('[data-fm="today"]');
	const create = root.querySelector('[data-fm="new"]');
	if (prev) {
		prev.addEventListener('click', () => showCalendar(addMonths(calendarView.view, -1)));
	}
	if (next) {
		next.addEventListener('click', () => showCalendar(addMonths(calendarView.view, 1)));
	}
	if (today) {
		today.addEventListener('click', () => showCalendar(currentMonthView()));
	}
	if (create) {
		create.addEventListener('click', () => openEventEditor(null));
	}
	for (const box of root.querySelectorAll('[data-fm="calendar"]')) {
		box.addEventListener('change', () => {
			const checked = [];
			for (const item of root.querySelectorAll('[data-fm="calendar"]:checked')) {
				checked.push(item.value);
			}
			showCalendar(calendarView.view, checked);
		});
	}
	for (const chip of root.querySelectorAll('[data-fm="event"]')) {
		chip.addEventListener('click', () => {
			const found = calendarView.events.find((event) => String(event.id) === chip.getAttribute('data-id'));
			openEventEditor(found || null);
		});
	}
}

function openEventEditor(event) {
	const wrap = root.querySelector('[data-fm="editor-wrap"]');
	if (!wrap) {
		return;
	}
	wrap.innerHTML = renderEventEditor(event, calendarView.calendars);
	const form = wrap.querySelector('[data-fm="editor"]');
	if (form) {
		form.addEventListener('submit', onEventSubmit);
	}
	const remove = wrap.querySelector('[data-fm="delete"]');
	if (remove) {
		remove.addEventListener('click', onEventDelete);
	}
}

async function calendarAccountId() {
	try {
		const session = await api.bootstrap();
		return session && session.selected_account_id
			? session.selected_account_id
			: undefined;
	} catch (error) {
		return undefined;
	}
}

function calendarStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

async function onEventSubmit(event) {
	event.preventDefault();
	try {
		const payload = collectEventPayload(root, await calendarAccountId());
		await saveEvent(api, payload);
		await showCalendar();
	} catch (error) {
		calendarStatus(error && error.message ? error.message : 'Save failed.');
	}
}

async function onEventDelete() {
	const id = collectEventPayload(root).id;
	if (!id) {
		return;
	}
	try {
		await deleteEvent(api, { id, accountId: await calendarAccountId() });
		await showCalendar();
	} catch (error) {
		calendarStatus(error && error.message ? error.message : 'Delete failed.');
	}
}

async function showRules() {
	try {
		const session = await api.bootstrap();
		const data = await loadRules(
			api,
			session && session.selected_account_id
				? { accountId: session.selected_account_id }
				: undefined
		);
		root.innerHTML = nav('rules')
			+ '<h1 data-fm="title">Rules</h1>'
			+ renderRules(data);
		wireNav();
	} catch (error) {
		root.innerHTML = '<p>Cannot load rules.</p>';
	}
}

async function showSettings() {
	try {
		const data = await loadPreferences(api);
		root.innerHTML = nav('settings')
			+ '<h1 data-fm="title">Settings</h1>'
			+ renderPreferencesForm(data.preferences);
		wireNav();
		wireSettingsForm();
	} catch (error) {
		root.innerHTML = '<p>Cannot load settings.</p>';
	}
}

function wireSettingsForm() {
	const form = root.querySelector('[data-fm="prefs"]');
	if (form) {
		form.addEventListener('submit', onSettingsSubmit);
	}
}

async function onSettingsSubmit(event) {
	event.preventDefault();
	try {
		const saved = await savePreferences(api, collectPreferencesPatch(root));
		root.innerHTML = nav('settings')
			+ '<h1 data-fm="title">Settings</h1>'
			+ renderPreferencesForm(saved.preferences);
		wireNav();
		wireSettingsForm();
		showSettingsStatus('Saved.');
	} catch (error) {
		showSettingsStatus(error && error.message ? error.message : 'Save failed.');
	}
}

function showSettingsStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

function showCompose(seed) {
	root.innerHTML = nav('compose')
		+ '<h1 data-fm="title">Compose</h1>'
		+ renderComposeForm(seed);
	wireNav();
	const form = root.querySelector('[data-fm="compose"]');
	if (form) {
		form.addEventListener('submit', onComposeSubmit);
	}
}

async function onComposeSubmit(event) {
	event.preventDefault();
	try {
		await sendMessage(api, collectComposePayload(root));
		await showMailbox('INBOX');
	} catch (error) {
		const status = root.querySelector('[data-fm="status"]');
		if (status) {
			status.textContent = error && error.message ? error.message : 'Send failed.';
		}
	}
}

async function showMessage(folder, uid, options) {
	const settings = options || {};
	const back = typeof settings.back === 'function'
		? settings.back
		: () => showMailbox(folder);
	try {
		const message = await loadMessage(api, folder, uid, { accountId: settings.accountId });
		const selected = selectMessageBody(message);
		let viewer = '';
		if (selected.kind === 'html') {
			viewer = '<iframe data-fm="body" sandbox="" title="Message body"></iframe>';
		} else {
			const pre = document.createElement('pre');
			pre.textContent = selected.body;
			viewer = pre.outerHTML;
		}
		root.innerHTML = nav('')
			+ '<button type="button" data-fm="back">Back</button>'
			+ renderMessageHeader(message)
			+ viewer
			+ renderAttachments(message);
		wireNav();
		const frame = root.querySelector('[data-fm="body"]');
		if (frame && selected.kind === 'html') {
			frame.srcdoc = selected.body;
		}
		root.querySelector('[data-fm="back"]').addEventListener('click', () => back());
	} catch (error) {
		root.innerHTML = '<p>Cannot load the message.</p>';
	}
}

/// Enters the authenticated app: ensures an account is selected (first
/// primary, else oldest — mirroring legacy login selection) so
/// account-dependent views work, then opens the inbox.
async function enterApp() {
	try {
		const session = await api.bootstrap();
		if (!session.selected_account_id) {
			const listing = await api.request('GET', '/accounts');
			const accounts = listing && Array.isArray(listing.accounts) ? listing.accounts : [];
			const primary = accounts.find((account) => account && account.is_primary)
				|| accounts.find((account) => account && account.id);
			if (primary) {
				await api.request('POST', '/switch-account', {
					body: { account_id: primary.id }
				});
			}
		}
	} catch (error) {
		void error;
	}
	await showMailbox('INBOX');
}

async function showAccounts(editingId) {
	try {
		const data = await loadAccounts(api);
		const accounts = data && Array.isArray(data.accounts) ? data.accounts : [];
		const editing = editingId
			? accounts.find((account) => String(account.id) === String(editingId)) || null
			: null;
		root.innerHTML = nav('accounts')
			+ '<h1 data-fm="title">Mail accounts</h1>'
			+ renderAccounts(data)
			+ '<h2 data-fm="subtitle">' + (editing ? 'Edit account' : 'Add account') + '</h2>'
			+ renderAccountEditor(editing)
			+ '<p data-fm="status"></p>';
		wireNav();
		wireAccounts();
	} catch (error) {
		root.innerHTML = '<p>Cannot load mail accounts.</p>';
	}
}

function wireAccounts() {
	const form = root.querySelector('[data-fm="editor"]');
	if (form) {
		form.addEventListener('submit', onAccountSubmit);
	}
	for (const button of root.querySelectorAll('[data-fm="switch"]')) {
		button.addEventListener('click', async () => {
			try {
				await switchAccount(api, button.getAttribute('data-id'));
				await showMailbox('INBOX');
			} catch (error) {
				accountsStatus(error && error.message ? error.message : 'Switch failed.');
			}
		});
	}
	for (const button of root.querySelectorAll('[data-fm="edit"]')) {
		button.addEventListener('click', () => showAccounts(button.getAttribute('data-id')));
	}
	for (const button of root.querySelectorAll('[data-fm="make-primary"]')) {
		button.addEventListener('click', async () => {
			try {
				await setPrimaryAccount(api, button.getAttribute('data-id'));
				await showAccounts();
			} catch (error) {
				accountsStatus(error && error.message ? error.message : 'Set primary failed.');
			}
		});
	}
	for (const button of root.querySelectorAll('[data-fm="delete"]')) {
		button.addEventListener('click', async () => {
			try {
				await deleteAccount(api, button.getAttribute('data-id'));
				await showAccounts();
			} catch (error) {
				accountsStatus(error && error.message ? error.message : 'Delete failed.');
			}
		});
	}
}

function accountsStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

async function onAccountSubmit(event) {
	event.preventDefault();
	try {
		const payload = collectAccountPayload(root);
		if (payload.id) {
			const id = payload.id;
			delete payload.id;
			await updateAccount(api, id, payload);
		} else {
			await addAccount(api, payload);
		}
		await showAccounts();
	} catch (error) {
		accountsStatus(error && error.message ? error.message : 'Save failed.');
	}
}

async function showMailbox(folder) {
	const current = typeof folder === 'string' && folder ? folder : 'INBOX';
	try {
		const folders = await loadFolders(api);
		const data = await loadMailbox(api, current, { limit: 25 });
		root.innerHTML = nav('inbox')
			+ '<h1 data-fm="title">Inbox</h1>'
			+ renderFolderList(folders, current)
			+ renderMailbox(data);
		wireNav();
		for (const item of root.querySelectorAll('[data-fm="folder"]')) {
			item.addEventListener('click', () => {
				showMailbox(item.getAttribute('data-name') || 'INBOX');
			});
		}
		for (const item of root.querySelectorAll('[data-fm="message"]')) {
			item.addEventListener('click', () => {
				showMessage(current, item.getAttribute('data-uid'));
			});
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load the mailbox.</p>';
	}
}

try {
	const session = await api.bootstrap();
	if (session && session.authenticated) {
		await enterApp();
	} else {
		renderLogin(root, api, enterApp);
		await showOAuthProviders();
	}
} catch (error) {
	root.innerHTML = '<p>Cannot reach the Frickmail server.</p>';
}

/// Appends configured OAuth/SSO provider buttons under the login form.
/// Best-effort: password sign-in always works, providers only when the
/// server has them configured.
async function showOAuthProviders() {
	let data = null;
	try {
		data = await loadProviders(api);
	} catch (error) {
		void error;
		return;
	}
	const buttons = renderProviderButtons(data);
	if (!buttons) {
		return;
	}
	const form = root.querySelector('[data-fm="form"]');
	if (!form) {
		return;
	}
	const wrap = document.createElement('div');
	wrap.innerHTML = buttons;
	form.after(wrap);
	const entries = data && Array.isArray(data.providers) ? data.providers : [];
	for (const button of wrap.querySelectorAll('[data-fm="oauth"]')) {
		button.addEventListener('click', () => {
			const entry = entries.find((item) => item && item.id === button.getAttribute('data-id'))
				|| { url: button.getAttribute('data-url') };
			signInWithProvider(window, api, entry, enterApp, (text) => {
				const status = root.querySelector('[data-fm="status"]');
				if (status) {
					status.textContent = text;
				}
			});
		});
	}
}
</script>
