<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Frickmail</title>
<link rel="stylesheet" href="./css/app.css">
</head>
<body>
<main id="app" aria-live="polite"><p>Loading Frickmail…</p></main>
<noscript><p>Frickmail needs JavaScript enabled.</p></noscript>
<script type="module">
import { ApiClient } from './js/api.js';
import { renderLogin } from './js/login.js';
import { loadMailbox, renderMailbox } from './js/mailbox.js';
import { loadFolders, renderFolderList } from './js/folders.js';
import { collectComposePayload, renderComposeForm, sendMessage } from './js/compose.js';
import { loadMessage, renderAttachments, renderMessageHeader, selectMessageBody } from './js/message.js';
import { loadTasks, renderTasks, renderTasksFilter } from './js/tasks.js';
import { collectPreferencesPatch, loadPreferences, renderPreferencesForm, savePreferences } from './js/settings.js';

const api = new ApiClient('');
const root = document.getElementById('app');

function nav(active) {
	const inbox = active === 'inbox' ? ' aria-current="page"' : '';
	const settings = active === 'settings' ? ' aria-current="page"' : '';
	const tasks = active === 'tasks' ? ' aria-current="page"' : '';
	const compose = active === 'compose' ? ' aria-current="page"' : '';
	return '<nav data-fm="nav">'
		+ '<button type="button" data-fm="nav-inbox"' + inbox + '>Inbox</button>'
		+ '<button type="button" data-fm="nav-tasks"' + tasks + '>Tasks</button>'
		+ '<button type="button" data-fm="nav-settings"' + settings + '>Settings</button>'
		+ '<button type="button" data-fm="nav-compose"' + compose + '>Compose</button>'
		+ '<button type="button" data-fm="nav-logout">Sign out</button>'
		+ '</nav>';
}

function wireNav() {
	const inboxButton = root.querySelector('[data-fm="nav-inbox"]');
	const tasksButton = root.querySelector('[data-fm="nav-tasks"]');
	const settingsButton = root.querySelector('[data-fm="nav-settings"]');
	const composeButton = root.querySelector('[data-fm="nav-compose"]');
	const logoutButton = root.querySelector('[data-fm="nav-logout"]');
	if (inboxButton) {
		inboxButton.addEventListener('click', () => showMailbox('INBOX'));
	}
	if (tasksButton) {
		tasksButton.addEventListener('click', () => showTasks('all'));
	}
	if (settingsButton) {
		settingsButton.addEventListener('click', showSettings);
	}
	if (composeButton) {
		composeButton.addEventListener('click', () => showCompose());
	}
	if (logoutButton) {
		logoutButton.addEventListener('click', signOut);
	}
}

async function signOut() {
	try {
		await api.logout();
	} catch (error) {
		void error;
	}
	// Refresh the CSRF token: logout cleared it and the next sign-in needs
	// a bootstrapped one. Failure still lands on the login form, whose first
	// submit will surface the token error honestly.
	try {
		await api.bootstrap();
	} catch (error) {
		void error;
	}
	renderLogin(root, api, showMailbox);
}

async function showTasks(filter) {
	try {
		const data = await loadTasks(api, filter);
		root.innerHTML = nav('tasks')
			+ '<h1 data-fm="title">Tasks</h1>'
			+ renderTasksFilter(filter)
			+ '<div data-fm="tasks-wrap">' + renderTasks(data) + '</div>';
		wireNav();
		const select = root.querySelector('[data-fm="filter"]');
		if (select) {
			select.addEventListener('change', () => showTasks(select.value));
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load tasks.</p>';
	}
}

async function showSettings() {
	try {
		const data = await loadPreferences(api);
		root.innerHTML = nav('settings')
			+ '<h1 data-fm="title">Settings</h1>'
			+ renderPreferencesForm(data.preferences);
		wireNav();
		wireSettingsForm();
	} catch (error) {
		root.innerHTML = '<p>Cannot load settings.</p>';
	}
}

function wireSettingsForm() {
	const form = root.querySelector('[data-fm="prefs"]');
	if (form) {
		form.addEventListener('submit', onSettingsSubmit);
	}
}

async function onSettingsSubmit(event) {
	event.preventDefault();
	try {
		const saved = await savePreferences(api, collectPreferencesPatch(root));
		root.innerHTML = nav('settings')
			+ '<h1 data-fm="title">Settings</h1>'
			+ renderPreferencesForm(saved.preferences);
		wireNav();
		wireSettingsForm();
		showSettingsStatus('Saved.');
	} catch (error) {
		showSettingsStatus(error && error.message ? error.message : 'Save failed.');
	}
}

function showSettingsStatus(text) {
	const status = root.querySelector('[data-fm="status"]');
	if (status) {
		status.textContent = text;
	}
}

function showCompose(seed) {
	root.innerHTML = nav('compose')
		+ '<h1 data-fm="title">Compose</h1>'
		+ renderComposeForm(seed);
	wireNav();
	const form = root.querySelector('[data-fm="compose"]');
	if (form) {
		form.addEventListener('submit', onComposeSubmit);
	}
}

async function onComposeSubmit(event) {
	event.preventDefault();
	try {
		await sendMessage(api, collectComposePayload(root));
		await showMailbox('INBOX');
	} catch (error) {
		const status = root.querySelector('[data-fm="status"]');
		if (status) {
			status.textContent = error && error.message ? error.message : 'Send failed.';
		}
	}
}

async function showMessage(folder, uid) {
	try {
		const message = await loadMessage(api, folder, uid);
		const selected = selectMessageBody(message);
		let viewer = '';
		if (selected.kind === 'html') {
			viewer = '<iframe data-fm="body" sandbox="" title="Message body"></iframe>';
		} else {
			const pre = document.createElement('pre');
			pre.textContent = selected.body;
			viewer = pre.outerHTML;
		}
		root.innerHTML = nav('')
			+ '<button type="button" data-fm="back">Back</button>'
			+ renderMessageHeader(message)
			+ viewer
			+ renderAttachments(message);
		wireNav();
		const frame = root.querySelector('[data-fm="body"]');
		if (frame && selected.kind === 'html') {
			frame.srcdoc = selected.body;
		}
		root.querySelector('[data-fm="back"]').addEventListener('click', () => showMailbox(folder));
	} catch (error) {
		root.innerHTML = '<p>Cannot load the message.</p>';
	}
}

async function showMailbox(folder) {
	const current = typeof folder === 'string' && folder ? folder : 'INBOX';
	try {
		const folders = await loadFolders(api);
		const data = await loadMailbox(api, current, { limit: 25 });
		root.innerHTML = nav('inbox')
			+ '<h1 data-fm="title">Inbox</h1>'
			+ renderFolderList(folders, current)
			+ renderMailbox(data);
		wireNav();
		for (const item of root.querySelectorAll('[data-fm="folder"]')) {
			item.addEventListener('click', () => {
				showMailbox(item.getAttribute('data-name') || 'INBOX');
			});
		}
		for (const item of root.querySelectorAll('[data-fm="message"]')) {
			item.addEventListener('click', () => {
				showMessage(current, item.getAttribute('data-uid'));
			});
		}
	} catch (error) {
		root.innerHTML = '<p>Cannot load the mailbox.</p>';
	}
}

try {
	const session = await api.bootstrap();
	if (session && session.authenticated) {
		await showMailbox();
	} else {
		renderLogin(root, api, showMailbox);
	}
} catch (error) {
	root.innerHTML = '<p>Cannot reach the Frickmail server.</p>';
}
</script>
</body>
</html>
