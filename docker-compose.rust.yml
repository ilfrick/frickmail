services:
  rust-dev:
    image: frickmail-rust-dev:latest
    build:
      context: .
      dockerfile: .docker/dev/rust/Dockerfile
    working_dir: /workspace/frickmail-server
    user: "${UID:-1000}:${GID:-1000}"
    environment:
      CARGO_HOME: /workspace/.docker/dev/.cache/cargo
      CARGO_TARGET_DIR: /workspace/.docker/dev/.cache/rust-target
      RUST_BACKTRACE: "1"
      FRICKMAIL__BIND_ADDR: "0.0.0.0:18088"
      FRICKMAIL__BASE_URL: "http://localhost:18088"
      FRICKMAIL__STATIC_ROOT: "/workspace/frickmail-static"
      # Set this to the same database URL used by the current Frickmail runtime.
      # Supported schemes are provided by SQLx Any: postgres://, mysql://, sqlite://.
      FRICKMAIL__DATABASE_URL: ""
      FRICKMAIL__REDIS_URL: "redis://redis:6379/0"
      # Integration test database URLs
      FM_TEST_MYSQL_URL: "mysql://root:password@mysql:3306/frickmail_test"
      FM_TEST_POSTGRES_URL: "postgres://postgres:password@postgres:5432/frickmail_test"
    volumes:
      - .:/workspace
    command: ["cargo", "check", "--workspace"]

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: password
      MYSQL_DATABASE: frickmail_test
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      timeout: 10s
      retries: 10

  postgres:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: password
      POSTGRES_DB: frickmail_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      timeout: 10s
      retries: 10
